# Render Blueprint: https://render.com/docs/blueprint-spec
# ramtalk is a fully static PWA (no server component), so it deploys as a Render static site
# served from Render's global CDN over HTTPS, which the camera and service worker require.
services:
  - type: web
    runtime: static
    name: ramtalk
    # --include=dev: Vite, Svelte and Vitest are devDependencies; install them even if
    # NODE_ENV=production is ever set. Unit tests gate the deploy.
    buildCommand: npm ci --include=dev && npm test && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    buildFilter:
      ignoredPaths:
        - README.md
        - tests/e2e/**
        - tests/fixtures/capture-sdp.mjs
    headers:
      # --- Security (all paths) ---
      # Same policy as the <meta> CSP in index.html, plus frame-ancestors (which only works as a header).
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin

      # --- Caching ---
      # The service worker, its registration script, the manifest and the HTML entry point must be
      # revalidated on every load, or installed PWAs would never see a new deploy. These paths don't
      # overlap with /assets/*, so no two Cache-Control rules ever match the same request.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /registerSW.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      # Vite emits content-hashed filenames here, so they can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
